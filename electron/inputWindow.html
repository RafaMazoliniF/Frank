<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Entrada RD</title>
  <style>
    body {
      background: #1e1e1e;
      color: white;
      font-family: Arial;
      padding: 20px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      font-size: 18px;
      margin-top: 15px;
    }
    button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2 id="msg">Entrada:</h2>

  <input id="inp" type="text" autofocus />

  <br>
  <button id="okBtn">OK</button>

  <script>
    const { ipcRenderer } = require("electron");

    ipcRenderer.on("set-message", (_, text) => {
      document.getElementById("msg").textContent = text;
    });

    const input = document.getElementById("inp");
    const btn = document.getElementById("okBtn");

    function sendValue() {
      ipcRenderer.send("input-value", input.value);
      window.close();
    }

    btn.onclick = sendValue;

    // 🔹 Capturar ENTER e enviar automaticamente
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendValue();
      }
    });

    // 🔹 Focar automaticamente no input
    window.onload = () => input.focus();
  </script>
</body>
</html>
